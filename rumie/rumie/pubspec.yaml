name: roomie
description: "A Tinder-style roommate matching app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  dio: ^5.4.0
  json_annotation: ^4.9.0
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Asset folders. Drop your PNG/SVG/JPG files into these directories
  # and they will be bundled with the app automatically.
  assets:
    - assets/icons/
    - assets/images/

  # When you add custom fonts, uncomment and edit the block below.
  # Drop the .ttf or .otf files into assets/fonts/ first.
  #
  # fonts:
  #   - family: Nunito
  #     fonts:
  #       - asset: assets/fonts/Nunito-Regular.ttf
  #       - asset: assets/fonts/Nunito-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Nunito-ExtraBold.ttf
  #         weight: 800
